buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

apply plugin: "expo-root-project"

// Hash long C++ object paths to fit Windows' path limit in nested checkouts.
subprojects {
    plugins.withId("com.android.library") {
        android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_OBJECT_PATH_MAX=240"
        android.externalNativeBuild.cmake.buildStagingDirectory = new File(rootProject.projectDir.parentFile, ".cache/cxx/" + project.name)
    }
}
